[project]
name = "airlock"
version = "0.1.0"
description = "Airlock: a local, prompt-injection-resistant overnight inbox brief."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krit Jain" }]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "dateparser>=1.2",
    "ollama>=0.4",
    "mcp>=1.2",
    "sentry-sdk>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[project.scripts]
airlock = "airlock.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
